<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Systems Interface</title>
</head>
<body>
    <h1 id="status-title">System Status: Idle</h1>
    <button id="toggle-btn" style="color: brown;">Execute Task</button>
    <br/><br/>
    <img id="image" src="" width="300">
    <div class="button_container">
        <button id="random_img_btn">Show Random Image</button>
    </div>
    <br/><br/>
    <button id="show_alert" custom-attr="Something">Show Alert</button>

    <!-- This is the "Linker" -->
    <!-- It instructs the browser to download and execute main.js -->
    <script src="main.mjs" type="module"></script>
    <script>
        let img_src = "../resources/images/blue_violet.png"
        
        const img_node = document.getElementById("image")
        if(img_node) {
            img_node.src = img_src
        }
    </script>
     <br/><br/>
    <textarea id="txt_area" rows="10" cols="50"></textarea>
    <br/><br/>
    <button id="extract_text_btn">Send Text to Worker</button>
    <br/><br/>
    <form id="submit-form" action="/submit-endpoint" method="POST">
        <!-- Label linked to an input via 'for' and 'id' -->
        <label for="username">Username:</label>
        <input type="text" id="username" name="user_name" required>    
        <br/>
        <label for="password">Password:</label>
        <input type="password" id="password" name="user_pass" required>
        <br/>

        <!-- Submission button triggers form action -->
        <button type="submit">Submit Data</button>
    </form>

</body>
</html>
